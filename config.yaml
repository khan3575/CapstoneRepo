
# BraTS GNN Segmentation - Centralized Configuration
# This file contains all paths and settings for the project
# Edit this file to adapt to your system

# =============================================================================
# PROJECT SETTINGS
# =============================================================================
project:
  name: "BraTS GNN Segmentation"
  version: "1.0.0"
  seed: 42  # Random seed for reproducibility

# =============================================================================
# PATH CONFIGURATION
# =============================================================================
paths:
  # Project root (auto-detected, don't change unless needed)
  project_root: "."

  # Raw Data Directories
  # Change this to your BraTS dataset location
  brats_2021_raw: "/mnt/bigdata/capstone/BraTS2021_Training_Data"
  brats_2023_raw: "/mnt/bigdata/capstone/BraTS2023_Training_Data"  # For future use

  # Processed Data Directories (relative to project_root)
  data:
    root: "data"
    organized: "data/organized"
    preprocessed: "data/preprocessed"
    graphs: "data/graphs"
    cv_folds: "data/cv_folds_v2"  # Updated Phase 1.2: leakage-free folds from cv_pool only
    cv_folds_v2: "data/cv_folds_v2"
    splits: "data/splits"  # held_out_test.json and cv_pool.json

  # Model Checkpoints (relative to project_root)
  checkpoints:
    root: "checkpoints"
    binary_training: "checkpoints/binary_v3"  # PRODUCTION: BCE only, ensemble=91.41% on 251 held-out (best result)
    multiclass_training: "checkpoints/multiclass_training"
    baseline_models: "checkpoints/baseline_models"

  # Research Results (relative to project_root)
  results:
    root: "research_results"
    ensemble: "research_results/ensemble_v2"  # Updated Phase 4: clean held-out evaluation
    ablation: "research_results/ablation_study_accuracy"
    timing_benchmark: "research_results/timing_benchmark"  # CURRENT: two_scenario_results.json
    failure_cases: "research_results/failure_cases"  # CURRENT: worst-case qualitative

  # Figures (relative to project_root)
  figures:
    root: "research_results/figures"  # CURRENT: fig_A through fig_G (paper figures)

  # Logs (relative to project_root)
  logs:
    root: "logs"
    training: "logs/training"
    evaluation: "logs/evaluation"

# =============================================================================
# MODEL CONFIGURATION
# =============================================================================
model:
  # GNN Architecture
  gnn:
    in_channels: 15  # Node feature dimension
    hidden_channels: 256
    num_layers: 5
    dropout: 0.1
    architecture: "graphsage"  # Options: graphsage, gat

  # Training Hyperparameters
  # NOTE: binary_v3 (production) used batch_size=24, accumulation_steps=2 (from config), ~18min/fold
  # weight_decay=0.01 was hardcoded in train_cv_fold.py (now fixed to read from config — FIX-2)
  training:
    batch_size: 24           # PRODUCTION VALUE used in binary_v3
    accumulation_steps: 2    # effective batch = batch_size * accum = 48
    learning_rate: 0.001
    weight_decay: 0.01       # FIX-1 (2026-03-14): corrected from 0.00001 — actual value used in all binary_v3 training
    max_epochs: 50
    early_stopping_patience: 10
    num_workers: 4           # parallel DataLoader workers (was 0)
    use_amp: true            # Automatic Mixed Precision (RTX 2060 Tensor Cores: ~1.5-2x speedup)

  # Cross-Validation
  cross_validation:
    n_folds: 5
    val_split: 0.1  # 10% of train for validation
    stratified: true

# =============================================================================
# DATA PROCESSING CONFIGURATION
# =============================================================================
preprocessing:
  # MRI Processing
  target_spacing: [1.0, 1.0, 1.0]  # Isotropic 1mm spacing
  target_size: [240, 240, 155]  # Standard BraTS size
  normalization: "z-score"  # Options: z-score, minmax

  # Slice Extraction
  num_slices_per_patient: 200  # Tumor-priority slices
  min_brain_pixels: 1000  # Minimum pixels for valid slice

# Graph Construction
graph_construction:
  # SLIC Superpixel Parameters
  n_superpixels: 200
  sigma: 0.3
  compactness: 0.1
  max_iter: 30

  # Edge Construction
  inter_slice_threshold: 10.0
  iou_threshold: 0.1
  knn_k: 3  # KNN connections between slices

  # Memory Management
  max_memory_gb: 4.0
  num_workers: 8

# =============================================================================
# EVALUATION CONFIGURATION
# =============================================================================
evaluation:
  # Metrics to compute
  metrics:
    - dice
    - accuracy
    - sensitivity
    - specificity
    - precision
    - hausdorff_distance

  # Threshold for binary classification
  threshold: 0.5

  # Qualitative visualization
  num_qualitative_examples: 50

# =============================================================================
# HARDWARE CONFIGURATION
# =============================================================================
hardware:
  device: "cuda"       # Options: cuda, cpu
  gpu_id: 0
  num_workers: 4       # DataLoader workers — matches i7-10700 (16 cores)
  pin_memory: true

# =============================================================================
# DATASET SPECIFIC SETTINGS
# =============================================================================
datasets:
  brats_2021:
    name: "BraTS 2021"
    num_patients: 1251
    num_classes: 4  # 0, 1, 2, 4 (background, NCR, edema, enhancing)
    modalities: ["T1", "T1ce", "T2", "FLAIR"]

  brats_2023:
    name: "BraTS 2023"
    num_patients: 1400  # Approximate
    num_classes: 4
    modalities: ["T1", "T1ce", "T2", "FLAIR"]
