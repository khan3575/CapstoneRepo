# Mini-test configuration
model:
  hidden_channels: 128
  gnn_out_channels: 64
  num_layers: 3
  dropout: 0.1
  gnn_type: 'sage'

training:
  epochs: 5
  batch_size: 16  # Smaller for mini-test
  learning_rate: 0.001
  weight_decay: 0.00001
  patience: 10

data:
  graph_dir: 'data/graphs_fixed_mini_test'
  num_workers: 3
